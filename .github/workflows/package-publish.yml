name: Publish Package

# Tag-triggered release pipeline: it runs only when you push a version tag,
# then publishes to the public npm registry (npmjs.com) via OIDC Trusted
# Publishing — no token or secret is stored anywhere. GitHub mints a one-time
# identity token (`id-token: write`) that npm trusts because this repo +
# workflow are registered as a Trusted Publisher on the package.
#
# One-time setup (see the README "Releasing" section):
#   1. Publish the first version manually (npm login && npm publish).
#   2. On npmjs.com, add this repo + workflow as the package's Trusted Publisher.
# After that, pushing a v* tag publishes automatically.
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Guard — tag must match package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}." >&2
            echo "Bump \"version\" in package.json, commit, then tag with that exact version." >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
