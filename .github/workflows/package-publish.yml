name: Publish Package

# Tag-triggered release pipeline: it runs only when you push a version tag
# (e.g. v0.1.3), then publishes to the public npm registry (npmjs.com) using
# an automation token stored as the `NPM_TOKEN` repository secret.
#
# One-time setup (see the README "Releasing" section):
#   1. On npmjs.com: Account -> Access Tokens -> Generate New Token ->
#      "Automation" (or a Granular token with read+write on this package).
#   2. In GitHub: repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret. Name it NPM_TOKEN and paste the token value.
# After that, pushing a v* tag publishes automatically.
#
# Website releases use `web-v*` tags and are handled by website-publish.yml.
# The `!web-v*` exclusion below keeps this package publish from firing on a
# website release tag.
on:
  push:
    tags:
      - 'v*'
      - '!web-v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Guard — tag must match package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}." >&2
            echo "Bump \"version\" in package.json, commit, then tag with that exact version." >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
