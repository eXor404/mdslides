name: Build and Deploy Website

# Website release pipeline — separate from the npm package publish.
# It runs only when you push a `web-v*` tag (e.g. web-v1.0.0); plain `v*`
# tags publish the npm package instead (see package-publish.yml).
on:
  push:
    tags: [ 'web-v*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/website
  CONTAINER_NAME: mdslides-web
  HOST_PORT: 3004
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install root deps (needed by the mdslides CLI for the deck demo)
        run: npm ci

      - name: Install website deps
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./website
          file: ./website/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set lower case image name
        run: |
          echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}/website" >> $GITHUB_ENV

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/${{ env.IMAGE_NAME_LC }}:${{ github.ref_name }}"
            # Per-run login dir: two deploys at once must not share credentials state.
            CONF="$(mktemp -d)"
            trap 'docker --config "$CONF" logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$CONF"' EXIT
            echo "${{ secrets.GITHUB_TOKEN }}" | docker --config "$CONF" login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull BEFORE touching the running container. If the pull fails, the
            # old version keeps serving and this job goes red instead of green.
            docker --config "$CONF" pull "$IMAGE"

            docker rm -f ${{ env.CONTAINER_NAME }} >/dev/null 2>&1 || true
            docker run -d --name ${{ env.CONTAINER_NAME }} -p 127.0.0.1:${{ env.HOST_PORT }}:80 --restart unless-stopped "$IMAGE"

            # A green job must mean the new container is actually up.
            sleep 5
            [ "$(docker inspect -f '{{.State.Running}}' ${{ env.CONTAINER_NAME }})" = true ]

            docker image prune -f
